<div id="math-game" style="width:100%; max-width:900px; margin:auto; font-family:sans-serif;">

<!-- MathJaxの読み込み -->
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)']],
    displayMath: [['\\[', '\\]']]
  }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<style>
#math-game * { box-sizing:border-box; user-select:none; }

#math-game .header {
    height:48px;
    background:#333;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 12px;
    font-size:14px;
}

#math-game .controls {
    background: #f4f4f4;
    padding: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    font-size: 14px;
    border-bottom: 2px solid #ddd;
}

#math-game .controls label {
    cursor: pointer;
    font-weight: bold;
}

#math-game .controls button {
    width: auto;
    padding: 6px 12px;
    margin: 0;
    font-size: 13px;
    background: #2196F3;
}

#math-game .board {
    display:flex;
    flex-direction:column;
}

#math-game .area {
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    padding:10px;
}

#math-game #bottom {
    border-top: 2px dashed #ccc;
}

#math-game .card {
    width:100%;
    cursor:pointer;
    border-radius:8px;
    box-shadow:0 1px 4px rgba(0,0,0,0.15);
}

/* 分数の極限は縦幅をとるため、padding-bottomを増やして縦長に調整 */
#math-game .card-inner-wrapper {
    position:relative;
    width:100%;
    padding-bottom:70%; 
}

#math-game .inner {
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    transition:0.25s;
    border-radius:8px;
}

#math-game .flipped .inner {
    transform:rotateY(180deg);
}

#math-game .front,
#math-game .back {
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:4px;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:8px;
    font-weight:normal;
}

#math-game .math-text {
    font-size: clamp(14px, 3.5vw, 18px);
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

#math-game #top .front { background:#BBDEFB; color:#0D47A1; font-weight:bold; }
#math-game #bottom .front { background:#FFE0B2; color:#E65100; font-weight:bold; }

#math-game .back {
    background:white;
    transform:rotateY(180deg);
}

#math-game #top .back { color:#1565C0; }
#math-game #bottom .back { color:#E65100; }

#math-game .matched {
    opacity:0;
    transform:scale(0);
    transition:0.25s;
}

#math-game .modal {
    display:none;
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:flex-start; 
    padding-top: 25px; 
    z-index: 10;
}

#math-game .modal-content {
    background:white;
    padding:20px;
    border-radius:10px;
    width:90%;
    max-width:420px;
    text-align:center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

#math-game button {
    width:100%;
    padding:10px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor: pointer;
    margin-top: 15px;
}
</style>

<div class="header">
    <div>極限・鬼畜めくり</div>
    <div>タイム: <span id="t">0</span>秒　ミス: <span id="m">0</span></div>
</div>

<div class="controls">
    <label><input type="radio" name="pairCount" value="3"> 3組</label>
    <label><input type="radio" name="pairCount" value="6" checked> 6組</label>
    <button id="reset-btn">やり直す</button>
</div>

<div class="board">
    <div class="area" id="top"></div>
    <div class="area" id="bottom"></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <h3 id="mt" style="margin-top:0; margin-bottom:15px;"></h3>
        <div id="txt"></div>
        <button id="btn">次へ</button>
    </div>
</div>

<script>
(function(){

const limitData = [
    { id: 1, type: '三角極限', latexA: '\\lim_{x\\to0} \\frac{\\sin x}{x}', latexB: '1', note: '円弧と三角形の面積評価によるはさみうちの原理で導く大原則。' },
    { id: 2, type: '三角極限', latexA: '\\lim_{x\\to0} \\frac{1-\\cos x}{x^2}', latexB: '\\frac{1}{2}', note: '分母分子に \\(1+\\cos x\\) を掛けて \\(\\sin^2 x\\) を作り出し基本極限に帰着。' },
    { id: 3, type: '指数対数極限', latexA: '\\lim_{x\\to0} \\frac{e^x-1}{x}', latexB: '1', note: '関数 \\(f(x)=e^x\\) の \\(x=0\\) における微分係数の定義そのもの。' },
    { id: 4, type: '指数対数極限', latexA: '\\lim_{x\\to0} \\frac{\\ln(1+x)}{x}', latexB: '1', note: 'ネイピア数の定義 \\(\\lim_{t\\to0}(1+t)^{1/t}=e\\) に対数をとって導出。' },
    { id: 5, type: '指数対数極限', latexA: '\\lim_{x\\to0} \\frac{a^x-1}{x}', latexB: '\\ln a', note: '関数 \\(f(x)=a^x\\) の \\(x=0\\) における微分係数の定義 \\((a^0 \\ln a)\\)。' },
    { id: 6, type: 'ネイピア数', latexA: '\\lim_{n\\to\\infty} \\left(1+\\frac{a}{n}\\right)^n', latexB: 'e^a', note: '\\(t=n/a\\) と置き換え、ネイピア数の定義に帰着させる。' },
    { id: 7, type: 'ネイピア数', latexA: '\\lim_{x\\to0} (1+x)^{1/x}', latexB: 'e', note: 'ネイピア数 \\(e\\) の定義式そのもの。' },
    { id: 8, type: 'テイラー応用', latexA: '\\lim_{x\\to0} \\frac{\\sin x - x}{x^3}', latexB: '-\\frac{1}{6}', note: '\\(\\sin x \\approx x - \\frac{x^3}{6}\\) のマクローリン展開の3次項の係数。' },
    { id: 9, type: 'テイラー応用', latexA: '\\lim_{x\\to0} \\frac{e^x - 1 - x}{x^2}', latexB: '\\frac{1}{2}', note: '\\(e^x \\approx 1 + x + \\frac{x^2}{2}\\) のマクローリン展開の2次項の係数。' },
    { id: 10, type: 'テイラー応用', latexA: '\\lim_{x\\to0} \\frac{\\ln(1+x) - x}{x^2}', latexB: '-\\frac{1}{2}', note: '\\(\\ln(1+x) \\approx x - \\frac{x^2}{2}\\) のマクローリン展開の2次項の係数。' },
    { id: 11, type: 'テイラー応用', latexA: '\\lim_{x\\to0} \\frac{\\tan x - x}{x^3}', latexB: '\\frac{1}{3}', note: '\\(\\tan x \\approx x + \\frac{x^3}{3}\\) の展開より。ロピタルでも証明可能。' },
    { id: 12, type: 'オーダー比較', latexA: '\\lim_{n\\to\\infty} \\sqrt[n]{n}', latexB: '1', note: '対数をとると \\(\\frac{\\ln n}{n}\\)。多項式は対数より強く \\(0\\) に向かうため \\(e^0=1\\)。' },
    { id: 13, type: 'オーダー比較', latexA: '\\lim_{n\\to\\infty} \\frac{n}{2^n}', latexB: '0', note: '指数関数の増加スピードは多項式のそれを圧倒するため、\\(0\\) に収束。' }
];

let topSel=null, botSel=null, lock=false, modalOpen=false;
let miss=0, match=0, start=null, timer;
let currentPairCount = 6;

const topArea=document.querySelector('#math-game #top');
const bottomArea=document.querySelector('#math-game #bottom');
const modal=document.querySelector('#math-game #modal');
const mt=document.querySelector('#math-game #mt');
const txt=document.querySelector('#math-game #txt');
const btn=document.querySelector('#math-game #btn');
const resetBtn=document.querySelector('#math-game #reset-btn');

function shuffle(a){ return a.sort(()=>Math.random()-0.5); }

function renderMath() {
    if(window.MathJax) {
        MathJax.typesetPromise().catch((err) => console.log(err.message));
    }
}

function card(d, type){
    let c=document.createElement('div');
    c.className='card';

    let wrapper=document.createElement('div');
    wrapper.className='card-inner-wrapper';

    let i=document.createElement('div');
    i.className='inner';

    let f=document.createElement('div');
    f.className='front';
    f.innerHTML = type === 'formula' ? '極限式<br><span style="font-size:10px; font-weight:normal;">(Tap)</span>' : '極限値<br><span style="font-size:10px; font-weight:normal;">(Tap)</span>';

    let b=document.createElement('div');
    b.className='back math-text'; 
    b.innerHTML = type === 'formula' ? `\\( \\displaystyle ${d.latexA} \\)` : `\\( \\displaystyle ${d.latexB} \\)`; 

    i.appendChild(f);
    i.appendChild(b);
    wrapper.appendChild(i);
    c.appendChild(wrapper);

    c.onclick=()=>{
        if(lock||modalOpen) return;

        if(!start){
            start=Date.now();
            timer=setInterval(()=>{
                document.getElementById('t').textContent = Math.floor((Date.now()-start)/1000);
            },250);
        }

        c.classList.add('flipped');

        if(type==='formula'){
            if(topSel) topSel.c.classList.remove('flipped');
            topSel={c,d};
        }else{
            if(botSel) botSel.c.classList.remove('flipped');
            botSel={c,d};
        }

        if(topSel && botSel){
            lock=true;

            setTimeout(()=>{
                // IDによる厳密な1対1判定
                if(topSel.d.id === botSel.d.id){
                    show(
                        '正解！',
                        `<div style="font-size:1.2em; margin:15px 0;">\\( \\displaystyle ${topSel.d.latexA} = ${topSel.d.latexB} \\)</div>`+
                        `<div style="font-size:0.9em; text-align:left; background:#f4f4f4; padding:10px; border-radius:6px;">`+
                        `<b>【解説: ${topSel.d.type}】</b><br>${topSel.d.note}</div>`,
                        ()=>{
                            topSel.c.classList.add('matched');
                            botSel.c.classList.add('matched');
                            match++;
                            reset();
                            if(match===currentPairCount) end();
                        }
                    );
                }else{
                    miss++;
                    document.getElementById('m').textContent=miss;

                    show(
                        'ちがうよ',
                        `<div style="font-size:0.9em; text-align:left; line-height:1.6;">`+
                        `❌ <b>あなたの選択</b><br>`+
                        `式: \\( \\displaystyle ${topSel.d.latexA} \\)<br>`+
                        `値: \\( \\displaystyle ${botSel.d.latexB} \\)<br>`+
                        `<hr style="border:0; border-top:1px dashed #ccc; margin:12px 0;">`+
                        `⭕ <b>正しい組み合わせ</b><br>`+
                        `\\( \\displaystyle ${topSel.d.latexA} = ${topSel.d.latexB} \\)<br>`+
                        `\\( \\displaystyle ${botSel.d.latexA} = ${botSel.d.latexB} \\)`+
                        `</div>`,
                        ()=>{
                            topSel.c.classList.remove('flipped');
                            botSel.c.classList.remove('flipped');
                            reset();
                        }
                    );
                }
            },600); // めくったカードを見る時間を少し確保
        }
    };

    return c;
}

function reset(){ topSel=null; botSel=null; lock=false; }

function show(t,body,cb){
    modalOpen=true;
    mt.textContent=t;
    txt.innerHTML=body;
    modal.style.display='flex';
    
    // モーダル内の数式を再レンダリング
    renderMath();

    btn.onclick=()=>{
        modal.style.display='none';
        modalOpen=false;
        cb();
    };
}

function end(){
    clearInterval(timer);
    show('クリア！',`<div style="margin:10px 0; font-size:18px;">タイム: <b>${document.getElementById('t').textContent}</b>秒<br>ミス: <b>${miss}</b>回</div>よくできました！`, init);
}

function init(){
    topSel=null; botSel=null;
    match=0; miss=0;
    document.getElementById('m').textContent=0;
    document.getElementById('t').textContent=0;
    if(timer) clearInterval(timer);
    start=null;

    const radios = document.getElementsByName('pairCount');
    for (let r of radios) {
        if (r.checked) currentPairCount = parseInt(r.value);
    }

    // 問題リストから指定組数だけランダムに抽出
    let gameData = shuffle([...limitData]).slice(0, currentPairCount);

    topArea.innerHTML='';
    bottomArea.innerHTML='';

    shuffle([...gameData]).forEach(d=>topArea.appendChild(card(d,'formula')));
    shuffle([...gameData]).forEach(d=>bottomArea.appendChild(card(d,'value')));

    // DOMに追加後、初期表示分のカード裏面の数式をレンダリング
    renderMath();
}

resetBtn.onclick = init;

init();

})();
</script>

</div>
